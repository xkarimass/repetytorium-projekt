<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Ulubione</title>

<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  padding:30px;
}

h1{
  text-align:center;
  color:#ff3c3c;
}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-top:30px;
}

.card{
  background:#1a1a1a;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.03);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card h2{
  color:#ff3c3c;
  padding:10px;
}

.card p{
  padding:0 10px 15px;
}
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.back-btn{
  background:#1a1a1a;
  border:2px solid #ff3c3c;
  color:white;
}

.card{
  max-width:350px;
}

.card h2{
  font-size:24px;
  padding:15px 15px 5px;
}

.card p{
  padding:0 15px 20px;
  color:#ddd;
  line-height:1.5;
}

.card img{
  height:220px;
  object-fit:cover;
}
body.light{
  background:#f5f5f5;
  color:black;
}

body.light .card{
  background:white;
}

body.light .card p{
  color:black;
}

body.light .back-btn{
  background:white;
  color:black;
}
.back-btn,
#themeToggle{

  background:#ff4b4b;
  border:none;
  color:white;

  padding:12px 22px;

  border-radius:12px;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;

  transition:0.3s;

  box-shadow:0 0 15px rgba(255,75,75,0.4);

}

.back-btn:hover,
#themeToggle:hover{

  background:#ff2f2f;

  transform:scale(1.05);

}
</style>
</head>

<body>

<h1>❤️ Ulubione</h1>

<div class="container" id="container"></div>
<div class="top-bar">

  <button onclick="window.history.back()" class="back-btn">
    ⬅ Wróć
  </button>

  <button id="themeToggle">
    🌙
  </button>

</div>

<script>
const container = document.getElementById("container");

const favorites =
  JSON.parse(localStorage.getItem("favorites")) || [];

if(favorites.length === 0){

  container.innerHTML =
    "<h2>Brak ulubionych 😢</h2>";

}

favorites.forEach(item => {

  const card = document.createElement("div");

  card.className = "card";

  card.innerHTML = `
    <img src="images/${item.image}">
    <h2>${item.title}</h2>
    <p>${item.description}</p>
  `;

  card.addEventListener("click", () => {
    window.location.href =
      "details.html?title=" + item.title;
  });

  container.appendChild(card);

});
const themeBtn = document.getElementById("themeToggle");

themeBtn.addEventListener("click", () => {

  document.body.classList.toggle("light");

  if(document.body.classList.contains("light")){

    localStorage.setItem("theme","light");
    themeBtn.textContent = "☀️";

  } else {

    localStorage.setItem("theme","dark");
    themeBtn.textContent = "🌙";

  }

});

window.addEventListener("load", () => {

  if(localStorage.getItem("theme") === "light"){

    document.body.classList.add("light");
    themeBtn.textContent = "☀️";

  }

});

</script>

</body>
</html>
