<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Anime & Games</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#000,#1a1a1a);
  color: white;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 40px 20px 20px 20px;
}

header h1 {
  font-size: 36px;
  color: #ff3c3c;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  0% { text-shadow: 0 0 5px #ff3c3c; }
  100% { text-shadow: 0 0 20px #ff0000; }
}

.search-box {
  text-align: center;
  margin-bottom: 50px;
}

input {
  padding: 15px;
  width: 300px;
  font-size: 16px;
  border-radius: 10px;
  border: 2px solid #ff3c3c;
  background: #000;
  color: white;
}

input:focus {
  outline: none;
  border-color: #ff0000;
  box-shadow: 0 0 10px #ff0000;
}

button {
  padding: 15px 20px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  margin-left: 10px;
  cursor: pointer;
  background: #ff3c3c;
  color: white;
  transition: 0.3s;
}

button:hover {
  background: #ff0000;
  transform: scale(1.05);
}

.featured-section, .top10-section {
  margin: 40px auto;
  max-width: 1000px;
  padding: 20px;
  border-radius: 15px;
  background: #1a1a1a;
  box-shadow: 0 0 40px rgba(255,0,0,0.3);
}

.featured-section h2, .top10-section h2 {
  color: #ff3c3c;
  margin-bottom: 20px;
}

.featured-container, .top10-container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

.card-mini {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  width: 200px;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255,0,0,0.3);
  transition: 0.3s;
}

.card-mini:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px #ff3c3c;
}

.card-mini img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  border-bottom: 2px solid #ff3c3c;
}

.card-mini h3 {
  color: #ff3c3c;
  margin: 8px;
  font-size: 16px;
}

.card-mini p {
  color: white;
  margin: 0 8px 8px 8px;
  font-size: 13px;
}

.auth-buttons {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 15px;
    z-index: 1000;
}

.auth-buttons button {
    padding: 10px 20px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    background: transparent;
    font-size: 14px;
    transition: 0.3s;
}

.btn-primary { border: 2px solid #ff0000; color: white; }
.btn-primary:hover { background: #ff0000; }

.btn-secondary { border: 2px solid #555555; color: white; }
.btn-secondary:hover { background: #555555; }

.modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0; top: 0; width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.85);
    overflow-y: auto;
}

.modal-content {
    background-color: #1a1a1a;
    margin: 5% auto;
    padding: 30px;
    border: 2px solid #ff3c3c;
    width: 340px;
    text-align: center;
    color: white;
    border-radius: 10px;
    position: relative;
}

.modal-content input {
    width: 90%;
    padding: 10px;
    margin: 6px 0;
    background: #333;
    border: 1px solid #555;
    color: white;
    border-radius: 5px;
    font-size: 14px;
}

.close-btn {
    position: absolute;
    right: 15px;
    top: 10px;
    cursor: pointer;
    font-size: 24px;
}

#auth-action-btn {
    background: #ff3c3c;
    color: white;
    border: none;
    padding: 12px;
    cursor: pointer;
    width: 100%;
    font-weight: bold;
    margin-top: 10px;
    border-radius: 5px;
}

body.light { background: #f5f5f5; color: black; }
body.light .featured-section, body.light .top10-section { background: #ffffff; color: black; }
body.light input { background: white !important; color: black !important; border: 2px solid #ff3c3c; }
body.light .btn-primary { color: black !important; border: 2px solid #ff0000; }
body.light .btn-secondary { color: black !important; border: 2px solid #555; }
body.light header h1 { color: #ff3c3c; }
body.light .card-mini { color: black !important; background: white !important; }
body.light .card-mini p { color: black !important; }
body.light .card h2, body.light .card p, body.light .info p, body.light .info { color: black !important; }

.favorites-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #ff3c3c;
  color: white;
  padding: 12px 22px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
  box-shadow: 0 0 15px rgba(255,0,0,0.3);
}

.favorites-btn:hover {
  background: #ff0000;
  transform: scale(1.05);
  box-shadow: 0 0 25px rgba(255,0,0,0.5);
}

select {
  width: 90%;
  padding: 10px;
  margin: 6px 0;
  background: #333;
  color: white;
  border-radius: 5px;
  border: 1px solid #555;
  font-size: 14px;
}

.fields-label {
  color: #ff3c3c;
  font-size: 13px;
  margin: 10px 0 4px 0;
  text-align: left;
  padding-left: 5%;
}
</style>
</head>
<body>

<div class="auth-buttons" id="authContainer">
    <button id="btn-signup-trigger" class="btn-secondary">Zarejestruj się</button>
    <button id="btn-login-trigger" class="btn-primary">Zaloguj się</button>
</div>

<a href="favorites.html" class="favorites-btn">❤️ Ulubione</a>
<a href="profile.html" class="favorites-btn">👤 Profil</a>
<button id="openAddModal" class="favorites-btn">➕ Dodaj tytuł</button>

<div id="auth-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2 id="modal-title">Zaloguj się</h2>
        <input type="text" id="auth-username" placeholder="Username">
        <input type="email" id="auth-email" placeholder="Email">
        <input type="password" id="auth-password" placeholder="Hasło (min. 6 znaków)">
        <button id="auth-action-btn">Zatwierdź</button>
        <p id="auth-error" style="color: red; font-size: 12px; margin-top: 10px;"></p>
    </div>
</div>

<header>
  <h1>Witaj w Anime & Games</h1>
  <button id="themeToggle" style="position:fixed;bottom:20px;right:20px;z-index:999;">🌙</button>
</header>

<div class="search-box">
  <form id="searchForm">
    <input type="text" id="searchInput" placeholder="Wpisz tytuł...">
    <button type="submit">Szukaj</button>
  </form>
</div>

<div class="featured-section">
  <h2>Polecane tytuły</h2>
  <div class="featured-container" id="featuredContainer"></div>
</div>

<div class="top10-section">
  <h2>Top 10 najlepiej ocenianych</h2>
  <div class="top10-container" id="top10Container"></div>
</div>

<div id="addModal" class="modal">
  <div class="modal-content">
    <span id="closeAddModal" class="close-btn">&times;</span>
    <h2>Dodaj własny tytuł</h2>

    <input type="text" id="newTitle" placeholder="Tytuł">
    <input type="text" id="newDescription" placeholder="Opis">
    <input type="file" id="newImage" accept="image/*" style="width:90%;margin:6px 0;font-size:13px;color:white;">

    <select id="newType">
      <option value="anime">Anime</option>
      <option value="game">Gra</option>
    </select>

    <div id="animeFields">
      <p class="fields-label">🎌 Szczegóły anime:</p>
      <input type="text" id="newGenre" placeholder="Gatunek (np. Akcja, Dramat)">
      <input type="number" id="newEpisodes" placeholder="Liczba odcinków">
      <input type="text" id="newEpisodeLength" placeholder="Czas odcinka (np. 24 min)">
      <input type="text" id="newStatus" placeholder="Status (np. Zakończone)">
      <input type="text" id="newStartDate" placeholder="Data rozpoczęcia (np. 2020-01-01)">
      <input type="text" id="newEndDate" placeholder="Data zakończenia">
    </div>

    <div id="gameFields" style="display:none;">
      <p class="fields-label">🎮 Szczegóły gry:</p>
      <input type="text" id="newGenreGame" placeholder="Gatunek (np. RPG, Akcja)">
      <input type="text" id="newReleaseYear" placeholder="Rok wydania">
      <input type="text" id="newStudio" placeholder="Studio">
      <input type="text" id="newPlatform" placeholder="Platforma (np. PC, PS5)">
    </div>

    <button id="saveNewTitle" style="width:90%;margin-top:12px;margin-left:0;">Zapisz</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, limit, setDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSA7M0IwPlj4wEWdENQUnstPuEtBMYAz8",
  authDomain: "projekt-da6f3.firebaseapp.com",
  projectId: "projekt-da6f3",
  storageBucket: "projekt-da6f3.firebasestorage.app",
  messagingSenderId: "139807931879",
  appId: "1:139807931879:web:3758409524b9e1cefe1142",
  measurementId: "G-K049858GR0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);


const modal = document.getElementById('auth-modal');
const modalTitle = document.getElementById('modal-title');
const actionBtn = document.getElementById('auth-action-btn');
const errorMsg = document.getElementById('auth-error');

document.getElementById('btn-login-trigger').onclick = () => {
    modal.style.display = "block";
    modalTitle.innerText = "Zaloguj się";
};

document.getElementById('btn-signup-trigger').onclick = () => {
    modal.style.display = "block";
    modalTitle.innerText = "Zarejestruj się";
};

document.querySelector('.close-btn').onclick = () => {
    modal.style.display = "none";
    errorMsg.innerText = "";
};

actionBtn.onclick = async () => {
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-password').value;
    try {
        if (modalTitle.innerText === "Zarejestruj się") {
            const username = document.getElementById("auth-username").value;
            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            await setDoc(doc(db, "users", userCredential.user.uid), {
                username: username,
                email: email
            });
        } else {
            await signInWithEmailAndPassword(auth, email, pass);
        }
        modal.style.display = "none";
    } catch (error) {
        errorMsg.innerText = "Błąd: " + error.message;
    }
};

onAuthStateChanged(auth, async (user) => {
    const authContainer = document.getElementById('authContainer');
    if (user) {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        let username = user.email;
        if (userSnap.exists()) username = userSnap.data().username;
        authContainer.innerHTML = `
            <span style="color:white;font-size:12px;align-self:center">👤 ${username}</span>
            <button id="btnLogout" class="btn-secondary">Wyloguj</button>
        `;
        document.getElementById('btnLogout').onclick = () => signOut(auth);
    } else {
        authContainer.innerHTML = `
            <button id="btn-signup-trigger" class="btn-secondary">Zarejestruj się</button>
            <button id="btn-login-trigger" class="btn-primary">Zaloguj się</button>
        `;
        document.getElementById('btn-login-trigger').onclick = () => { modal.style.display = "block"; modalTitle.innerText = "Zaloguj się"; };
        document.getElementById('btn-signup-trigger').onclick = () => { modal.style.display = "block"; modalTitle.innerText = "Zarejestruj się"; };
    }
});


let items = [
  {title:"Attack on Titan",type:"anime",description:"Ludzkość walczy z Tytanami...",image:"aot.jpg"},
  {title:"Death Note",type:"anime",description:"Młody chłopak znajduje notes śmierci...",image:"DN.jpg"},
  {title:"The Witcher 3",type:"game",description:"Przygody Geralta z Rivii...",image:"wiedzmin3.jpg"},
  {title:"Red Dead Redemption 2",type:"game",description:"Przygoda w otwartym świecie Dzikiego Zachodu",image:"rdr2.jpg"},
  {title:"Naruto",type:"anime",description:"Historia młodego ninja z wioski Liścia",image:"naruto.jpg"},
  {title:"Naruto Shippuden",type:"anime",description:"Kontynuacja przygód Naruto i jego przyjaciół",image:"narutoship.jpg"},
  {title:"Boruto: Naruto Next Generations",type:"anime",description:"Opowieść o synu Naruto, Boruto",image:"boruto.jpg"},
  {title:"The Last of Us Part I",type:"game",description:"Przygoda Joela i Ellie w postapokaliptycznym świecie",image:"TLOU1.jpg"},
  {title:"The Last of Us Part II",type:"game",description:"Kontynuacja historii Ellie i Joela",image:"TLOU2.jpg"},
  {title:"Cyberpunk 2077",type:"game",description:"Futurystyczne RPG w Night City",image:"CB.jpg"},
  {title:"GTA 3",type:"game",description:"Klasyczna gra akcji w Liberty City",image:"GT3.jpg"},
  {title:"GTA 4",type:"game",description:"Kontynuacja przygód w Liberty City",image:"GT4.jpg"},
  {title:"GTA 5",type:"game",description:"Największa część serii GTA",image:"GT5.jpg"},
  {title:"GTA: San Andreas",type:"game",description:"Klasyczna gra w ogromnym stanie San Andreas",image:"GTSA.jpg"},
  {title:"GTA: Vice City",type:"game",description:"Kultowa gra w Vice City",image:"GTVC.jpg"},
  {title:"Elden Ring",type:"game",description:"Mroczne RPG akcji w ogromnym świecie fantasy",image:"elden.jpg"},
  {title:"God of War",type:"game",description:"Przygody Kratosa w mitologii nordyckiej",image:"GoW.jpg"},
  {title:"God of War Ragnarok",type:"game",description:"Kontynuacja historii Kratosa",image:"GoWR.jpg"},
  {title:"One Piece",type:"anime",description:"Przygody Luffy'ego i jego przyjaciół",image:"OP.jpg"},
  {title:"Demon Slayer",type:"anime",description:"Historia Tanjiro i jego siostry",image:"DS.jpg"},
  {title:"Tokyo Ghoul",type:"anime",description:"Historia Kaneki'ego, pół-gula",image:"TG.jpg"},
  {title:"Jujutsu Kaisen",type:"anime",description:"Walka z przeklętymi duchami",image:"JJK.jpg"},
  {title:"Clannad",type:"anime",description:"Historia Tomoyi i Nagisy, pełna emocji",image:"clannad.jpg"},
  {title:"Clannad: After Story",type:"anime",description:"Kontynuacja przygód Tomoyi i Nagisy",image:"clannadAS.jpg"}
];


function getImageSrc(image) {
  if (image.startsWith("data:") || image.startsWith("http")) return image;
  return "images/" + image;
}

function getCustomTitles() {
  return JSON.parse(localStorage.getItem("customTitles")) || [];
}

function saveCustomTitles(data) {
  try {
    localStorage.setItem("customTitles", JSON.stringify(data));
    return true;
  } catch(e) {
    alert("Błąd: za mało miejsca w localStorage! Usuń stare tytuły.");
    return false;
  }
}

function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement("canvas");
      const MAX = 400;
      let w = img.width;
      let h = img.height;
      if (w > h) {
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      } else {
        if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      }
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL("image/jpeg", 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function createCard(item) {
  const card = document.createElement("div");
  card.className = "card-mini";
  card.innerHTML = `
    <img src="${getImageSrc(item.image)}">
    <h3>${item.title}</h3>
    <p>${item.description}</p>
  `;
  card.addEventListener("click", () => {
    window.location.href = "details.html?title=" + encodeURIComponent(item.title);
  });
  return card;
}


const featuredItems = [
  {title:"Attack on Titan",image:"aot.jpg",description:"Ludzkość walczy z Tytanami..."},
  {title:"The Witcher 3",image:"wiedzmin3.jpg",description:"Przygody Geralta z Rivii..."},
  {title:"Naruto",image:"naruto.jpg",description:"Historia młodego ninja z wioski Liścia"},
  {title:"Elden Ring",image:"elden.jpg",description:"Mroczne RPG akcji w ogromnym świecie fantasy"}
];

const featuredContainer = document.getElementById("featuredContainer");
featuredItems.forEach(item => featuredContainer.appendChild(createCard(item)));


const customTitles = getCustomTitles();
items = [...items, ...customTitles];
customTitles.forEach(item => featuredContainer.appendChild(createCard(item)));


async function loadTop10() {
  const ratingsCol = collection(db, "ratings");
  const q = query(ratingsCol, orderBy("total", "desc"), limit(10));
  const snapshot = await getDocs(q);
  const top10Container = document.getElementById("top10Container");
  top10Container.innerHTML = "";
  snapshot.forEach(d => {
    const data = d.data();
    const avg = data.votes ? (data.total / data.votes).toFixed(1) : 0;
    const item = items.find(i => i.title === d.id);
    if (item) {
      const card = document.createElement("div");
      card.className = "card-mini";
      card.innerHTML = `
        <img src="${getImageSrc(item.image)}">
        <h3>${item.title}</h3>
        <p>Średnia: ${avg} / 10</p>
      `;
      card.addEventListener("click", () => {
        window.location.href = "details.html?title=" + encodeURIComponent(item.title);
      });
      top10Container.appendChild(card);
    }
  });
}

loadTop10();


document.getElementById("searchForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const value = document.getElementById("searchInput").value.trim();
  if (value !== "") window.location.href = "results.html?search=" + encodeURIComponent(value);
});


const themeBtn = document.getElementById("themeToggle");
themeBtn.addEventListener("click", () => {
  document.body.classList.toggle("light");
  if (document.body.classList.contains("light")) {
    themeBtn.textContent = "☀️";
    localStorage.setItem("theme", "light");
  } else {
    themeBtn.textContent = "🌙";
    localStorage.setItem("theme", "dark");
  }
});
window.addEventListener("load", () => {
  if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light");
    themeBtn.textContent = "☀️";
  }
});


const addModal = document.getElementById("addModal");
document.getElementById("openAddModal").onclick = () => { addModal.style.display = "block"; };
document.getElementById("closeAddModal").onclick = () => { addModal.style.display = "none"; };

document.getElementById("newType").addEventListener("change", function() {
  if (this.value === "anime") {
    document.getElementById("animeFields").style.display = "block";
    document.getElementById("gameFields").style.display = "none";
  } else {
    document.getElementById("animeFields").style.display = "none";
    document.getElementById("gameFields").style.display = "block";
  }
});


document.getElementById("saveNewTitle").addEventListener("click", () => {
  const title = document.getElementById("newTitle").value.trim();
  const description = document.getElementById("newDescription").value.trim();
  const file = document.getElementById("newImage").files[0];
  const type = document.getElementById("newType").value;

  if (!title || !description || !file) {
    alert("Uzupełnij wszystkie pola!");
    return;
  }

 
  compressImage(file, function(imageUrl) {
    let newItem = {
      title: title,
      description: description,
      image: imageUrl,
      type: type
    };

    if (type === "anime") {
      newItem.genre = document.getElementById("newGenre").value;
      newItem.episodes = document.getElementById("newEpisodes").value;
      newItem.episodeLength = document.getElementById("newEpisodeLength").value;
      newItem.status = document.getElementById("newStatus").value;
      newItem.startDate = document.getElementById("newStartDate").value;
      newItem.endDate = document.getElementById("newEndDate").value;
    } else {
      newItem.genre = document.getElementById("newGenreGame").value;
      newItem.releaseYear = document.getElementById("newReleaseYear").value;
      newItem.studio = document.getElementById("newStudio").value;
      newItem.platform = document.getElementById("newPlatform").value;
    }

    const current = getCustomTitles();
    current.push(newItem);
    const saved = saveCustomTitles(current);
    if (saved) {
      alert("Dodano nowy tytuł!");
      location.reload();
    }
  });
});

</script>

</body>
</html>
