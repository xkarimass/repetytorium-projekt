<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Profil</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
min-height:100vh;
padding:40px 0;
}

.profile-card{

  background:#1a1a1a;
  padding:40px;
  border-radius:20px;
  width:350px;

  box-shadow:0 0 30px rgba(255,0,0,0.3);

  text-align:center;

}

.avatar{

  width:100px;
  height:100px;

  border-radius:50%;

  background:#ff3c3c;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:40px;

  margin:auto;
  margin-bottom:20px;

}

.username{

  font-size:28px;
  font-weight:bold;

}

.email{

  opacity:0.7;
  margin-top:10px;

}

.stats{

  margin-top:30px;

}

.stat{

  background:#222;
  padding:15px;
  border-radius:12px;
  margin-top:10px;

}

.back-btn{

  display:inline-block;
  margin-top:30px;

  background:#ff3c3c;
  color:white;

  padding:12px 20px;
  border-radius:12px;

  text-decoration:none;

}
.favorite-item{

  background:#222;

  border-radius:16px;

  margin-top:15px;

  overflow:hidden;

  box-shadow:0 0 15px rgba(255,0,0,0.2);

  transition:0.3s;

}

.favorite-item:hover{

  transform:scale(1.02);

  box-shadow:0 0 25px rgba(255,0,0,0.4);

}

.favorite-item img{

  width:100%;

  height:180px;

  object-fit:cover;

  display:block;

}

.favorite-content{

  padding:15px;

}

.favorite-content h3{

  margin:0;

  color:#ff3c3c;

  font-size:22px;

}

.favorite-content p{

  margin-top:10px;

  opacity:0.8;

  font-size:14px;

  line-height:1.5;

}
body.light{

  background:#f5f5f5;
  color:black;

}

body.light .profile-card{

  background:white;
  color:black;

}

body.light .favorite-item{

  background:#ededed;

}

body.light .stat{

  background:#ededed;

}

body.light .favorite-content h3{

  color:#ff3c3c;

}

body.light .favorite-content p{

  color:black;

}

body.light .back-btn{

  color:white;

}

</style>
</head>
<body>

<div class="profile-card">

  <div class="avatar">
    👤
  </div>

  <div class="username" id="username">
    Loading...
  </div>

  <div class="email" id="email">
    Loading...
  </div>

  <div class="stats">

    <h2 style="margin-top:30px;">
  ❤️ Ulubione
</h2>

<div id="favoritesList">

</div>

    <div class="stat">
      ⭐ Ratings system active
    </div>

  </div>

  <a href="index.html" class="back-btn">
    ← Powrót
  </a>

</div>
<button id="themeToggle" style="
position:fixed;
bottom:20px;
right:20px;
z-index:999;
padding:15px;
border:none;
border-radius:50%;
background:#ff3c3c;
color:white;
cursor:pointer;
font-size:20px;
">
🌙
</button>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSA7M0IwPlj4wEWdENQUnstPuEtBMYAz8",
  authDomain: "projekt-da6f3.firebaseapp.com",
  projectId: "projekt-da6f3",
  storageBucket: "projekt-da6f3.firebasestorage.app",
  messagingSenderId: "139807931879",
  appId: "1:139807931879:web:3758409524b9e1cefe1142",
  measurementId: "G-K049858GR0"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);
onAuthStateChanged(auth, async(user)=>{

  if(user){

    const snap = await getDoc(
      doc(db,"users",user.uid)
    );

    if(snap.exists()){

      document.getElementById("username")
      .innerText = snap.data().username;

    }

    document.getElementById("email")
    .innerText = user.email;

  

    const favorites =
    JSON.parse(
      localStorage.getItem("favorites")
    ) || [];

    const favoritesList =
    document.getElementById("favoritesList");

    if(favorites.length === 0){

      favoritesList.innerHTML =
      "<p>Brak ulubionych tytułów</p>";

    }else{

favorites.forEach(item=>{

  favoritesList.innerHTML += `

    <div 
      class="favorite-item"
      onclick="
        window.location.href=
        'details.html?title=${encodeURIComponent(item.title)}'
      "
      style="cursor:pointer;"
    >

      <img src="${(item.image.startsWith('http') || item.image.startsWith('data:')) ? item.image : 'images/' + item.image}">

      <div class="favorite-content">

        <h3>
          ${item.title}
        </h3>

        <p>
          ${item.description || "Brak opisu"}
        </p>

      </div>

    </div>

  `;

});

    }

  }else{

    window.location.href="index.html";

  }

});
const themeBtn =
document.getElementById("themeToggle");

themeBtn.addEventListener("click",()=>{

  document.body.classList.toggle("light");

  if(document.body.classList.contains("light")){

    themeBtn.textContent="☀️";

    localStorage.setItem(
      "theme",
      "light"
    );

  }else{

    themeBtn.textContent="🌙";

    localStorage.setItem(
      "theme",
      "dark"
    );

  }

});

window.addEventListener("load",()=>{

  const saved =
  localStorage.getItem("theme");

  if(saved==="light"){

    document.body.classList.add("light");

    themeBtn.textContent="☀️";

  }

});

</script>

</body>
</html>
